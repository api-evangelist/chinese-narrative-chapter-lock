openapi: 3.2.0
info:
  title: cultureBiz chapter-lock Use API
  description: Chapter lock for people translating or AI-translating Chinese webnovels into English. Locks public-genre conventions and extracts title-specific names from pasted buyer text only. Not a full novel MT engine. Does not host novels.
  version: 0.1.0
tags:
- name: Use
paths:
  /use/webnovel-loc:
    get:
      summary: Use Webnovel Loc
      operationId: use_webnovel_loc_use_webnovel_loc_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
      tags:
      - Use
  /use/honorific-lock:
    get:
      summary: Use Honorific Lock
      operationId: use_honorific_lock_use_honorific_lock_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
      tags:
      - Use
