openapi: 3.2.0
info:
  title: cultureBiz chapter Lock API
  description: Chapter lock for people translating or AI-translating Chinese webnovels into English. Locks public-genre conventions and extracts title-specific names from pasted buyer text only. Not a full novel MT engine. Does not host novels.
  version: 0.1.0
tags:
- name: Lock
paths:
  /v1/lock:
    post:
      summary: Lock Endpoint
      operationId: lock_endpoint_v1_lock_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Lock Endpoint V1 Lock Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lock
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LockRequest:
      properties:
        text:
          type: string
          title: Text
          description: Pasted Chinese narrative (buyer text only)
      type: object
      required:
      - text
      title: LockRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
