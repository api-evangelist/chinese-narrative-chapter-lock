name: Chinese Narrative Chapter Lock
description: A chapter-scoped terminology-locking REST API for CN→EN webnovel (xianxia/cultivation) localization.
  It locks genre conventions, honorifics, ranks, sect and character names from pasted buyer text and exports a two-column
  glossary CSV for downstream MT/CAT tools like DeepL or Crowdin. It is not a full novel MT engine and does not
  host novels; consistency is per-paste.
