  version: 1.0.0
  x-generated: '2026-09-05'
  x-method: generated
  x-source: >-
    Extends openapi/chinese-narrative-chapter-lock-openapi.json (fetched verbatim from
    https://culturebiz-xianxia-lock.onrender.com/openapi.json). Adds the server the docs
