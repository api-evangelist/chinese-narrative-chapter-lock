extends: chinese-narrative-chapter-lock-openapi.json
actions:
  - target: $
    update:
      servers:
        - url: https://culturebiz-xianxia-lock.onrender.com
          description: Production (Render origin; unauthenticated — RapidAPI gateway adds metering)
      tags:
