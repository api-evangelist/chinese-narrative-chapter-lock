          description: Chapter-scoped terminology locking
        - name: operations
          description: Health and funnel metrics
        - name: pages
          description: HTML landing/docs/use-case pages
  - target: $.paths['/v1/lock'].post
    update:
      tags: [terminology]
      description: >-
        Lock chapter-scoped terminology from pasted Chinese narrative (buyer text only).
        The 200 response object carries: locked_terms[] {zh, en, pos} — genre-convention
        terms with locked English renderings; title_entities[] {zh, kind} — title-specific
        people/sects/skills; character_bible[] {zh, kind, count} — recurring entities with
        occurrence counts; csv — a two-column source,target glossary for MT/CAT tools
        (title entities pass through untranslated). Documented with a worked sample at /docs.
  - target: $.paths['/health'].get
    update:
      tags: [operations]
      description: Liveness. Returns {"status":"ok"}.
  - target: $.paths['/v1/metrics'].get
    update:
      tags: [operations]
      description: Stranger-funnel counters (unique_visitors, trials, api_calls, checkout_starts); no PII.
